name: Audit manual blockers governance

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'data/github_manual_tasks.csv'
      - 'data/user_decision_queue.csv'
      - 'github-tasks/index.html'
      - 'scripts/audit_github_manual_tasks.js'
      - 'scripts/test_github_manual_tasks.js'
      - 'scripts/audit_user_decision_queue.js'
      - 'scripts/lib/status_sets.js'
      - 'scripts/test_status_sets.js'
      - 'scripts/audit_project_mode.js'
      - 'scripts/audit_project_mode_full.js'
      - 'docs/GITHUB-MANUAL-TASKS-GOVERNANCE.md'
      - 'package.json'
      - '.github/workflows/manual-tasks-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-tasks-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check scripts/audit_github_manual_tasks.js
          node --check scripts/test_github_manual_tasks.js
          node --check scripts/audit_user_decision_queue.js
          node --check scripts/lib/status_sets.js
          node --check scripts/test_status_sets.js

      - name: Test status sets
        run: node scripts/test_status_sets.js

      - name: Test manual tasks governance
        run: npm run test:manual-tasks

      - name: Audit manual tasks governance
        run: npm run audit:github-manual-tasks

      - name: Audit user decision queue
        run: node scripts/audit_user_decision_queue.js

      - name: Run full project mode audits
        run: node scripts/audit_project_mode_full.js
