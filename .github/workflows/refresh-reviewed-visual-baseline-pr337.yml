name: Refresh reviewed visual baseline for PR 337

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'scripts/refresh_reviewed_visual_baseline_2026_07_31.js'
      - '.github/workflows/refresh-reviewed-visual-baseline-pr337.yml'
      - 'docs/visual-baseline/approved-case-deltas.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-reviewed-visual-baseline-pr337
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event.pull_request.number == 337 && github.head_ref == 'feature/tos-next-content-action-2026-07-31' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tos-next-content-action-2026-07-31
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download reviewed visual artifact
        uses: actions/download-artifact@v4
        with:
          name: visual-baseline-306-1
          path: .artifacts/reviewed-baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30662143264

      - name: Check refresh script syntax
        run: node --check scripts/refresh_reviewed_visual_baseline_2026_07_31.js

      - name: Refresh selected approved cases
        run: node scripts/refresh_reviewed_visual_baseline_2026_07_31.js

      - name: Validate approval policy
        run: node scripts/test_visual_case_delta_policy.js

      - name: Commit refreshed baseline
        shell: bash
        run: |
          if git diff --quiet -- docs/visual-baseline; then
            echo 'Reviewed baseline is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/visual-baseline/css-reg-006.png \
            docs/visual-baseline/css-reg-007.png \
            docs/visual-baseline/css-reg-010.png \
            docs/visual-baseline/css-reg-011.png \
            docs/visual-baseline/manifest.json \
            docs/visual-baseline/approved-case-deltas.json
          git commit -m 'Refresh reviewed visual baseline for content actions'
          git push origin HEAD:feature/tos-next-content-action-2026-07-31
