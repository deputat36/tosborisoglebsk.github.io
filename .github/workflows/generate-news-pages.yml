name: Generate news pages manually

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-generate-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate news pages
        run: node scripts/generate_news_pages.js
      - name: Generate accurate sitemap
        run: node scripts/generate_sitemap.js
      - name: Commit generated pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO news pages manually'
          file_pattern: 'news/*/index.html sitemap.xml'
