name: Generate news pages

on:
  workflow_dispatch:
  push:
    branches:
      - release-2025-12-22
    paths:
      - 'data/news.json'
      - 'data/toses.json'
      - 'scripts/generate_news_pages.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate news pages
        run: node scripts/generate_news_pages.js
      - name: Commit generated pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO news pages'
          file_pattern: 'news/*/index.html sitemap.xml'
