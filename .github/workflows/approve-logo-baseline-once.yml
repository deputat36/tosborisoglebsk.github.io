name: Approve logo baseline once

on:
  push:
    branches:
      - agent/new-site-logo
    paths:
      - '.github/workflows/approve-logo-baseline-once.yml'

permissions:
  contents: write

jobs:
  approve:
    if: github.repository == 'deputat36/tosborisoglebsk.github.io' && github.ref == 'refs/heads/agent/new-site-logo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VISUAL_BASELINE_BASE_URL: http://127.0.0.1:4173
      VISUAL_BASELINE_OUTPUT: docs/visual-baseline
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/new-site-logo
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install visual dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Apply responsive stylesheet
        run: node scripts/patch_tos_detail_responsive_styles.js

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/logo-baseline-server.log 2>&1 &
          echo $! > /tmp/logo-baseline-server.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/logo-baseline-server.log
          exit 1

      - name: Capture approved baseline
        run: node scripts/capture_visual_baseline.js

      - name: Audit approved baseline
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'true'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/logo-baseline-server.pid ]; then
            kill "$(cat /tmp/logo-baseline-server.pid)" 2>/dev/null || true
          fi

      - name: Commit approved screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual-baseline
          if git diff --cached --quiet; then
            echo 'Baseline is already current.'
            exit 0
          fi
          git commit -m 'Обновить visual baseline нового логотипа'
          git push origin HEAD:agent/new-site-logo
