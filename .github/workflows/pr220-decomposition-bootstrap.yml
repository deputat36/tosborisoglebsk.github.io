name: Bootstrap PR 220 decomposition inventory

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'data/pr220_changed_paths.json'
      - 'scripts/generate_pr220_decomposition_inventory.js'
      - '.github/workflows/pr220-decomposition-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr220-decomposition-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate inventory once
        run: node scripts/generate_pr220_decomposition_inventory.js

      - name: Commit only decomposition CSV
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Сформировать реестр декомпозиции PR 220'
          file_pattern: 'data/pr220_decomposition_inventory.csv'
