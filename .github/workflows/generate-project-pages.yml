name: Generate project pages manually

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-generate-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate project pages
        run: node scripts/generate_project_pages.js
      - name: Generate accurate sitemap
        run: node scripts/generate_sitemap.js
      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO project pages manually'
          file_pattern: 'projects/*/index.html sitemap.xml'
