name: Bootstrap project legacy redirect integration

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'scripts/apply_project_legacy_integration.js'
      - '.github/workflows/project-legacy-integration-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-legacy-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'project-legacy-redirects-main-2026-07-14'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: project-legacy-redirects-main-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply shared-core integration
        run: node scripts/apply_project_legacy_integration.js

      - name: Validate integration and renderer
        run: |
          node scripts/test_project_legacy_redirects.js
          node scripts/audit_projects_integrity.js
          node --check scripts/generate_project_pages.js

      - name: Commit only shared-core integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/audit_project_mode.js scripts/audit_project_mode_full.js .github/workflows/generate-tos-pages.yml
          if git diff --cached --quiet; then
            echo 'No shared-core changes to commit.'
            exit 0
          fi
          git commit -m 'Подключить legacy redirects проектов к CI'
          git push origin HEAD:project-legacy-redirects-main-2026-07-14
