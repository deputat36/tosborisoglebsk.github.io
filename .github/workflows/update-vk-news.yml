name: Update VK news

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-vk-news-release
  cancel-in-progress: true

jobs:
  update-vk-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release-2025-12-22
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Import VK posts to news.json
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ vars.VK_OWNER_ID }}
          VK_DOMAIN: ${{ vars.VK_DOMAIN }}
          VK_HASHTAGS: ${{ vars.VK_HASHTAGS }}
          VK_COUNT: ${{ vars.VK_COUNT }}
          NEWS_LIMIT: ${{ vars.NEWS_LIMIT }}
        run: node scripts/import_vk_news.js
      - name: Synchronize content origins
        run: node scripts/migrate_content_origins.js
      - name: Generate content origin metrics
        run: node scripts/generate_content_origin_report.js
      - name: Generate trusted news pages
        run: node scripts/generate_news_pages.js
      - name: Regenerate dependent material pages
        run: node scripts/generate_material_pages.js
      - name: Generate accurate sitemap
        run: node scripts/generate_sitemap.js
      - name: Audit content origins
        run: node scripts/audit_content_origins.js
      - name: Audit internal links
        run: node scripts/audit_site_links.js
      - name: Audit SEO basics
        run: node scripts/audit_seo.js
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto update trusted news from VK'
          branch: release-2025-12-22
          file_pattern: 'data/news.json data/content_origin_report.json news/*/index.html materials/*/index.html sitemap.xml'
