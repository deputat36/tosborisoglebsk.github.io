name: Culinary battle contracts
on:
  pull_request:
    branches: [release-2025-12-22]
    paths:
      - 'culinary-battle/**'
      - 'assets/css/culinary-battle.css'
      - 'assets/js/culinary-battle.js'
      - 'scripts/prepare_culinary_battle.mjs'
      - 'scripts/test_culinary_battle_contract.js'
      - 'scripts/test_culinary_battle_browser.js'
      - 'scripts/test_culinary_battle_live_client.js'
      - 'scripts/test_culinary_battle_db.mjs'
      - 'supabase/**'
      - '.github/workflows/culinary-battle-contract.yml'
  push:
    branches: [feature/culinary-battle-live-go-live]
    paths:
      - 'culinary-battle/**'
      - 'assets/css/culinary-battle.css'
      - 'assets/js/culinary-battle.js'
      - 'scripts/prepare_culinary_battle.mjs'
      - 'scripts/test_culinary_battle_contract.js'
      - 'scripts/test_culinary_battle_browser.js'
      - 'scripts/test_culinary_battle_db.mjs'
      - 'supabase/**'
      - '.github/workflows/culinary-battle-contract.yml'
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check client and preparation code syntax
        run: |
          node --check assets/js/culinary-battle.js
          node --check scripts/prepare_culinary_battle.mjs
          node --check scripts/test_culinary_battle_contract.js
          node --check scripts/test_culinary_battle_db.mjs
      - name: Check 26 teams, 19 dishes, individual code generation and secret boundaries
        run: node scripts/test_culinary_battle_contract.js

  browser-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/culinary-preview-server.log 2>&1 &
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/culinary-battle/demo-data.json > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/culinary-preview-server.log
          exit 1
      - name: Exercise 19 scarce dish draws with 26 teams in Chromium
        run: node scripts/test_culinary_battle_browser.js
      - name: Test real API client contract using HTTP stubs
        run: node scripts/test_culinary_battle_live_client.js
      - name: Upload demo screenshot and PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culinary-battle-demo-screenshots
          path: .artifacts/culinary-battle/
          if-no-files-found: warn
          retention-days: 14

  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: culinary_ci_disposable
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d culinary_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      BATTLE_DB_TEST_MODE: '1'
      BATTLE_DB_TEST_DB_NAME: culinary_ci_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test migration and simultaneous last-dish draws
        run: node scripts/test_culinary_battle_db.mjs
