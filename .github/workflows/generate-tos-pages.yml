name: Generate TOS pages

on:
  workflow_dispatch:
  push:
    branches:
      - release-2025-12-22
    paths:
      - 'data/toses.json'
      - 'data/news.json'
      - 'data/articles.json'
      - 'data/projects.json'
      - 'data/events.json'
      - 'data/needs.json'
      - 'data/documents.json'
      - 'data/grants.json'
      - 'scripts/validate_data.js'
      - 'scripts/audit_tos_data.js'
      - 'scripts/generate_tos_pages.js'
      - 'scripts/generate_sitemap.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON data
        run: node scripts/validate_data.js
      - name: Audit TOS data
        run: node scripts/audit_tos_data.js
      - name: Generate TOS pages
        run: node scripts/generate_tos_pages.js
      - name: Generate extended sitemap
        run: node scripts/generate_sitemap.js
      - name: Commit generated pages, sitemap and audit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO TOS pages, sitemap and audit'
          file_pattern: 'tos/*/index.html sitemap.xml data/tos_audit.json'
