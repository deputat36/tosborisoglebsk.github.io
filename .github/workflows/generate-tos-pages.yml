name: Generate TOS pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - '**/index.html'
      - 'admin/**'
      - 'data/*.json'
      - 'data/*.csv'
      - 'docs/STATUS.md'
      - 'docs/STATUS-DOCUMENT-GOVERNANCE.md'
      - 'scripts/**/*.js'
      - 'assets/js/*.js'
      - 'assets/css/*.css'
      - 'assets/img/tos-logos/*'
      - '.github/workflows/*.yml'
  push:
    branches:
      - release-2025-12-22
    paths:
      - '**/index.html'
      - 'admin/**'
      - 'data/*.json'
      - 'data/*.csv'
      - 'docs/STATUS.md'
      - 'docs/STATUS-DOCUMENT-GOVERNANCE.md'
      - 'scripts/**/*.js'
      - 'assets/js/*.js'
      - 'assets/css/*.css'
      - 'assets/img/tos-logos/*'
      - '.github/workflows/*.yml'

permissions:
  contents: write

concurrency:
  group: generate-tos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          find scripts assets/js admin -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Test status document contracts
        run: npm run test:status-document
      - name: Test generated page cleanup safety
        run: node scripts/test_generated_page_cleanup.js
      - name: Test dynamic Actions check contract
        run: node scripts/test_actions_check_dynamic_contract.js
      - name: Guard priority TOS update evidence
        run: node scripts/audit_priority_tos_update_evidence.js
      - name: Test priority TOS update evidence guard
        run: node scripts/test_priority_tos_update_evidence.js
      - name: Improve weak TOS descriptions
        run: node scripts/upgrade_tos_descriptions.js
      - name: Sync uploaded TOS logos
        run: node scripts/sync_tos_logos.js
      - name: Migrate TOS trust metadata
        run: node scripts/migrate_tos_trust_metadata.js
      - name: Migrate document legal statuses
        run: node scripts/migrate_document_legal_statuses.js
      - name: Synchronize content origins
        run: node scripts/migrate_content_origins.js
      - name: Generate content origin metrics
        run: node scripts/generate_content_origin_report.js
      - name: Patch places index browser
        run: node scripts/patch_places_index_browser.js
      - name: Check patched places generator syntax
        run: node --check scripts/generate_places_pages.js
      - name: Generate place pages
        run: node scripts/generate_places_pages.js
      - name: Generate RSS feed
        run: node scripts/generate_rss.js
      - name: Validate JSON data
        run: node scripts/validate_data.js
      - name: Audit TOS trust metadata
        run: node scripts/audit_tos_trust_metadata.js
      - name: Audit document legal statuses
        run: node scripts/audit_document_legal_statuses.js
      - name: Audit public repository sensitive data
        run: |
          set -o pipefail
          node scripts/audit_public_repo_sensitive_data.js 2>&1 | tee sensitive-data-audit.log
      - name: Upload sensitive data audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-data-audit-log
          path: sensitive-data-audit.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove sensitive data audit log
        if: always()
        run: rm -f sensitive-data-audit.log
      - name: Audit personal data readiness
        run: node scripts/audit_personal_data_readiness.js
      - name: Generate publication basis inventory
        run: node scripts/generate_publication_basis_inventory.js
      - name: Test publication basis inventory
        run: node scripts/test_publication_basis_inventory.js
      - name: Audit publication basis inventory
        run: node scripts/audit_publication_basis_inventory.js
      - name: Generate publication basis review queue
        run: node scripts/generate_publication_basis_review_queue.js
      - name: Test publication basis review queue
        run: node scripts/test_publication_basis_review_queue.js
      - name: Audit publication basis review queue
        run: node scripts/audit_publication_basis_review_queue.js
      - name: Audit publication basis confirmation templates
        run: node scripts/audit_publication_basis_confirmation_templates.js
      - name: Generate admin surface inventory
        run: node scripts/generate_admin_surface_inventory.js
      - name: Audit local admin surface
        run: node scripts/audit_admin_surface.js
      - name: Audit content origins
        run: node scripts/audit_content_origins.js
      - name: Audit TOS data
        run: node scripts/audit_tos_data.js
      - name: Generate content audit
        run: node scripts/generate_content_audit.js
      - name: Generate collection tasks CSV
        run: node scripts/generate_collection_tasks_csv.js
      - name: Generate verification tasks CSV
        run: node scripts/generate_verification_tasks_csv.js
      - name: Generate priority TOS readiness
        run: node scripts/generate_priority_tos_readiness.js
      - name: Refine site audit next actions
        run: node scripts/refine_site_audit_actions.js
      - name: Patch TOS detail generator trust
        run: node scripts/patch_tos_detail_generator_trust.js
      - name: Patch TOS detail responsive stylesheet
        run: node scripts/patch_tos_detail_responsive_styles.js
      - name: Check patched TOS generator syntax
        run: node --check scripts/generate_tos_pages.js
      - name: Clean stale generated collection pages
        run: node scripts/cleanup_generated_collection_pages.js
      - name: Generate TOS pages
        run: node scripts/generate_tos_pages.js
      - name: Audit generated TOS detail trust pages
        run: node scripts/audit_tos_detail_pages_content.js
      - name: Audit visual overflow fixes
        run: node scripts/audit_visual_overflow_fixes.js
      - name: Generate news pages
        run: node scripts/generate_news_pages.js
      - name: Generate material pages
        run: node scripts/generate_material_pages.js
      - name: Generate done pages
        run: node scripts/generate_done_pages.js
      - name: Generate need pages
        run: node scripts/generate_need_pages.js
      - name: Audit generated collection pages
        env:
          GENERATED_PAGE_CLEANUP_STRICT: 'true'
        run: node scripts/audit_generated_page_cleanup.js
      - name: Generate project pages
        run: node scripts/generate_project_pages.js
      - name: Audit project legacy redirects
        env:
          PROJECT_LEGACY_REDIRECTS_STRICT: 'true'
        run: node scripts/audit_projects_integrity.js
      - name: Patch P0 public trust guardrails
        run: node scripts/patch_p0_public_trust.js
      - name: Audit P0 trust guardrails
        run: node scripts/audit_p0_trust_guardrails.js
      - name: Audit public surface changes
        run: node scripts/audit_public_surface_changes.js
      - name: Patch site navigation and discovery links
        run: node scripts/patch_site_navigation.js
      - name: Patch residents quick start
        run: node scripts/patch_residents_quick_start.js
      - name: Focus public audience pages
        run: node scripts/patch_public_audience_focus.js
      - name: Audit public audience focus
        run: node scripts/audit_public_audience_focus.js
      - name: Focus TOS catalog search and trust
        run: node scripts/patch_tos_catalog_focus.js
      - name: Audit focused TOS catalog
        run: node scripts/audit_tos_catalog_content.js
      - name: Patch contacts channel boundaries
        run: node scripts/patch_contacts_channel_boundaries.js
      - name: Connect priority TOS readiness section
        run: node scripts/patch_priority_tos_readiness_page.js
      - name: Patch page index labels
        run: node scripts/patch_page_index_labels.js
      - name: Patch project passport label
        run: node scripts/patch_project_passport_label.js
      - name: Patch llms links
        run: node scripts/patch_llms_links.js
      - name: Patch accessibility basics
        run: node scripts/patch_accessibility_basics.js
      - name: Patch accessibility landmarks
        run: node scripts/patch_accessibility_landmarks.js
      - name: Patch public controls accessibility
        run: node scripts/patch_accessibility_public_controls.js
      - name: Patch internal tools accessibility
        run: node scripts/patch_accessibility_internal_tools.js
      - name: Generate accessibility and performance baseline
        run: node scripts/generate_accessibility_performance_report.js
      - name: Generate site health report
        run: node scripts/generate_site_health_report.js
      - name: Enrich site health with priority readiness
        run: node scripts/enrich_site_health_readiness.js
      - name: Generate dynamic Actions check page
        run: node scripts/generate_actions_check_page.js
      - name: Audit dynamic Actions check page
        run: node scripts/audit_actions_check_content.js
      - name: Update status document metrics
        run: node scripts/update_status_document_metrics.js
      - name: Audit status document
        run: node scripts/audit_status_document.js
      - name: Audit priority TOS readiness
        run: node scripts/audit_priority_tos_readiness.js
      - name: Generate public index
        run: node scripts/generate_page_index.js
      - name: Generate extended sitemap
        run: node scripts/generate_sitemap.js
      - name: Run manual audit extensions
        run: node scripts/audit_manual_extensions.js
      - name: Audit internal links
        run: node scripts/audit_site_links.js
      - name: Audit SEO basics
        run: node scripts/audit_seo.js
      - name: Audit accessibility and performance baseline
        run: node scripts/audit_accessibility_performance_report.js
      - name: Audit service route governance
        run: node scripts/audit_route_governance.js
      - name: Audit CSS visual regression matrix
        run: node scripts/audit_css_regression_matrix.js
      - name: Audit CSS source structure fingerprint
        run: node scripts/audit_css_source_structure.js
      - name: Refresh admin surface inventory after patch steps
        run: node scripts/generate_admin_surface_inventory.js
      - name: Run full project mode audits
        run: |
          set -o pipefail
          node scripts/audit_project_mode_full.js 2>&1 | tee project-audit.log
      - name: Upload project audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-audit-log
          path: project-audit.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary audit log
        if: always()
        run: rm -f project-audit.log
      - name: Commit generated pages, sitemap and audit
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO pages, sitemap and audit'
          file_pattern: '.'
