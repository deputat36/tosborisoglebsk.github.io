name: Generate TOS pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - release-2025-12-22
    paths:
      - '**/index.html'
      - 'data/*.json'
      - 'scripts/*.js'
      - 'assets/js/*.js'
      - 'assets/css/*.css'
      - 'assets/img/tos-logos/*'
      - '.github/workflows/generate-tos-pages.yml'

permissions:
  contents: write

concurrency:
  group: generate-tos-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          find scripts assets/js -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Improve weak TOS descriptions
        run: node scripts/upgrade_tos_descriptions.js
      - name: Sync uploaded TOS logos
        run: node scripts/sync_tos_logos.js
      - name: Generate starter TOS needs and projects
        run: node scripts/generate_tos_starter_content.js
      - name: Generate starter TOS news
        run: node scripts/generate_tos_starter_news.js
      - name: Generate starter TOS result stories
        run: node scripts/generate_tos_starter_done.js
      - name: Generate place pages
        run: node scripts/generate_places_pages.js
      - name: Generate RSS feed
        run: node scripts/generate_rss.js
      - name: Validate JSON data
        run: node scripts/validate_data.js
      - name: Audit TOS data
        run: node scripts/audit_tos_data.js
      - name: Generate content audit
        run: node scripts/generate_content_audit.js
      - name: Generate collection tasks CSV
        run: node scripts/generate_collection_tasks_csv.js
      - name: Generate verification tasks CSV
        run: node scripts/generate_verification_tasks_csv.js
      - name: Refine site audit next actions
        run: node scripts/refine_site_audit_actions.js
      - name: Generate TOS pages
        run: node scripts/generate_tos_pages.js
      - name: Generate news pages
        run: node scripts/generate_news_pages.js
      - name: Generate done pages
        run: node scripts/generate_done_pages.js
      - name: Generate need pages
        run: node scripts/generate_need_pages.js
      - name: Generate project pages
        run: node scripts/generate_project_pages.js
      - name: Patch site navigation and discovery links
        run: node scripts/patch_site_navigation.js
      - name: Patch page index labels
        run: node scripts/patch_page_index_labels.js
      - name: Patch project passport label
        run: node scripts/patch_project_passport_label.js
      - name: Patch llms links
        run: node scripts/patch_llms_links.js
      - name: Generate site health report
        run: node scripts/generate_site_health_report.js
      - name: Generate public index
        run: node scripts/generate_page_index.js
      - name: Generate extended sitemap
        run: node scripts/generate_sitemap.js
      - name: Audit internal links
        run: node scripts/audit_site_links.js
      - name: Audit SEO basics
        run: node scripts/audit_seo.js
      - name: Commit generated pages, sitemap and audit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Generate SEO pages, sitemap and audit'
          file_pattern: '.'
