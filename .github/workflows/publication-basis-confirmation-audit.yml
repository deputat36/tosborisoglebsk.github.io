name: Audit publication basis confirmation packet

on:
  pull_request:
    paths:
      - '.github/workflows/publication-basis-confirmation-audit.yml'
      - '.github/workflows/generate-tos-pages.yml'
      - 'data/personal_data_readiness.json'
      - 'data/publication_basis_inventory.json'
      - 'data/publication_basis_review_queue.csv'
      - 'data/publication_basis_confirmation_templates.json'
      - 'docs/PERSONAL-DATA-READINESS-2026-07-14.md'
      - 'docs/PUBLICATION-BASIS-INVENTORY-2026-07-14.md'
      - 'docs/PUBLICATION-BASIS-REVIEW-QUEUE-2026-07-14.md'
      - 'docs/PUBLICATION-BASIS-CONFIRMATION-PACKET-2026-07-14.md'
      - 'package.json'
      - 'scripts/generate_publication_basis_inventory.js'
      - 'scripts/audit_publication_basis_inventory.js'
      - 'scripts/test_publication_basis_inventory.js'
      - 'scripts/generate_publication_basis_review_queue.js'
      - 'scripts/audit_publication_basis_review_queue.js'
      - 'scripts/test_publication_basis_review_queue.js'
      - 'scripts/audit_publication_basis_confirmation_templates.js'
      - 'scripts/audit_project_mode.js'
      - 'scripts/audit_project_mode_full.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-basis-confirmation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Audit personal data readiness
        run: npm run audit:personal-data-readiness

      - name: Regenerate publication basis inventory
        run: npm run report:publication-basis

      - name: Test and audit publication basis inventory
        run: |
          npm run test:publication-basis
          npm run audit:publication-basis

      - name: Regenerate publication basis review queue
        run: npm run report:publication-basis-queue

      - name: Test and audit publication basis review queue
        run: |
          npm run test:publication-basis-queue
          npm run audit:publication-basis-queue

      - name: Audit publication basis confirmation templates
        run: |
          set -o pipefail
          npm run audit:publication-basis-confirmation 2>&1 | tee publication-basis-confirmation-audit.log

      - name: Run full project mode audits
        run: |
          set -o pipefail
          node scripts/audit_project_mode_full.js 2>&1 | tee publication-basis-confirmation-project-audit.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-basis-confirmation-audit
          path: |
            publication-basis-confirmation-audit.log
            publication-basis-confirmation-project-audit.log
          if-no-files-found: warn
          retention-days: 7
