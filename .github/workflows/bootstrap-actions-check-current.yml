name: Bootstrap current dynamic Actions check

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - '.github/workflows/bootstrap-actions-check-current.yml'
      - 'scripts/generate_actions_check_page.js'
      - 'scripts/audit_actions_check_content.js'
      - 'scripts/test_actions_check_dynamic_contract.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-actions-check-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'actions-check-dynamic-current-2026-07-14')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: actions-check-dynamic-current-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Integrate runner and workflow blocks
        run: |
          node <<'NODE'
          const fs = require('fs');

          function insertAfter(file, marker, insertion) {
            let text = fs.readFileSync(file, 'utf8');
            if (text.includes(insertion.trim())) return;
            if (!text.includes(marker)) throw new Error(`${file}: marker not found: ${marker}`);
            text = text.replace(marker, `${marker}${insertion}`);
            fs.writeFileSync(file, text, 'utf8');
          }

          insertAfter(
            'scripts/audit_project_mode.js',
            "  ['PR 220 decomposition', 'scripts/audit_pr220_decomposition.js'],",
            "\n  ['Actions check dynamic contract self-test', 'scripts/test_actions_check_dynamic_contract.js'],\n  ['Actions check content', 'scripts/audit_actions_check_content.js'],"
          );

          insertAfter(
            'scripts/audit_project_mode_full.js',
            "  ['PR 220 decomposition audit', 'scripts/audit_pr220_decomposition.js'],",
            "\n  ['Actions check dynamic contract self-test', 'scripts/test_actions_check_dynamic_contract.js'],\n  ['Actions check content audit', 'scripts/audit_actions_check_content.js'],"
          );

          insertAfter(
            '.github/workflows/generate-tos-pages.yml',
            '          find scripts assets/js -name "*.js" -print0 | xargs -0 -n1 node --check',
            "\n      - name: Test dynamic Actions check contract\n        run: node scripts/test_actions_check_dynamic_contract.js"
          );

          insertAfter(
            '.github/workflows/generate-tos-pages.yml',
            '      - name: Enrich site health with priority readiness\n        run: node scripts/enrich_site_health_readiness.js',
            "\n      - name: Generate dynamic Actions check page\n        run: node scripts/generate_actions_check_page.js\n      - name: Audit dynamic Actions check page\n        run: node scripts/audit_actions_check_content.js"
          );
          NODE

      - name: Validate integration and generate page
        run: |
          node scripts/test_actions_check_dynamic_contract.js
          node scripts/generate_actions_check_page.js
          node scripts/audit_actions_check_content.js
          node scripts/audit_css_source_structure.js
          node scripts/audit_pr220_decomposition.js
          node scripts/audit_project_mode_full.js

      - name: Commit only integrated Actions files
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Интегрировать динамический Actions check от актуального main'
          file_pattern: 'actions-check/index.html scripts/audit_project_mode.js scripts/audit_project_mode_full.js .github/workflows/generate-tos-pages.yml'
