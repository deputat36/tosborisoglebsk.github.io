name: Bootstrap current dynamic Actions check

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - '.github/workflows/bootstrap-actions-check-current.yml'
      - 'scripts/generate_actions_check_page.js'
      - 'scripts/audit_actions_check_content.js'
      - 'scripts/test_actions_check_dynamic_contract.js'
      - 'package.json'
      - '.github/workflows/generate-tos-pages.yml'
      - 'scripts/audit_project_mode.js'
      - 'scripts/audit_project_mode_full.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-actions-check-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'actions-check-dynamic-current-2026-07-14')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: actions-check-dynamic-current-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and validate current Actions page
        run: |
          node scripts/test_actions_check_dynamic_contract.js
          node scripts/generate_actions_check_page.js
          node scripts/audit_actions_check_content.js
          node scripts/audit_css_source_structure.js
          node scripts/audit_pr220_decomposition.js
          node scripts/audit_project_mode_full.js

      - name: Commit only generated Actions page
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Сгенерировать динамическую страницу Actions check'
          file_pattern: 'actions-check/index.html'
