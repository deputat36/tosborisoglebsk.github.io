name: Bootstrap current PR 220 decomposition inventory

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'data/pr220_changed_paths.json'
      - 'scripts/generate_pr220_decomposition_inventory.js'
      - '.github/workflows/bootstrap-pr220-decomposition-current.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-pr220-decomposition-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pr220-decomposition-current-2026-07-14')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: pr220-decomposition-current-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate 99-row inventory
        run: node scripts/generate_pr220_decomposition_inventory.js

      - name: Commit only decomposition inventory
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Сгенерировать inventory декомпозиции PR 220'
          file_pattern: 'data/pr220_decomposition_inventory.csv'
