name: Audit admin tools

on:
  workflow_dispatch:
  pull_request:
    branches:
      - release-2025-12-22
      - admin-consolidation-2026-07-13
    paths:
      - 'admin/**'
      - 'docs/ADMIN-*.md'
      - 'scripts/audit_admin_*.js'
      - 'scripts/audit_project_mode*.js'
      - 'package.json'
      - '.github/workflows/admin-tools-audit.yml'

permissions:
  contents: read

concurrency:
  group: admin-tools-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check project JavaScript
        run: npm run check:js

      - name: Audit admin consolidation
        run: node scripts/audit_admin_consolidation.js

      - name: Audit safe admin tools
        run: node scripts/audit_admin_safe_tools.js

      - name: Run full project mode audits
        run: npm run audit:project-mode-full
