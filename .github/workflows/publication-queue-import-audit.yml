name: Audit publication queue import

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'publication-import/**'
      - 'assets/css/publication-queue-import.css'
      - 'assets/js/publication-queue-contract.js'
      - 'assets/js/publication-queue-import-validation.js'
      - 'assets/js/publication-queue-import.js'
      - 'data/publication_queue.csv'
      - 'scripts/test_publication_queue_import_validation.js'
      - 'scripts/audit_publication_queue.js'
      - 'scripts/audit_publication_queue_content.js'
      - 'scripts/audit_publication_queue_import_page.js'
      - 'content-intake/index.html'
      - 'publication-queue/index.html'
      - '.github/workflows/publication-queue-import-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-queue-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/publication-queue-contract.js
          node --check assets/js/publication-queue-import-validation.js
          node --check assets/js/publication-queue-import.js
          node --check scripts/test_publication_queue_import_validation.js
          node --check scripts/audit_publication_queue.js
          node --check scripts/audit_publication_queue_content.js
          node --check scripts/audit_publication_queue_import_page.js

      - name: Test queue contract and import validation
        run: node scripts/test_publication_queue_import_validation.js

      - name: Audit canonical publication queue
        run: node scripts/audit_publication_queue.js

      - name: Audit publication queue content
        run: node scripts/audit_publication_queue_content.js

      - name: Audit import page
        run: |
          set -o pipefail
          node scripts/audit_publication_queue_import_page.js 2>&1 | tee publication-queue-import-audit.log

      - name: Audit internal links
        run: node scripts/audit_site_links.js

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-queue-import-audit
          path: |
            publication-import/index.html
            publication-queue/index.html
            data/publication_queue.csv
            publication-queue-import-audit.log
          if-no-files-found: warn
          retention-days: 14
