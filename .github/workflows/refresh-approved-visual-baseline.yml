name: Refresh approved visual baseline

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - '.github/workflows/refresh-approved-visual-baseline.yml'
      - 'docs/visual-baseline/**'

permissions:
  contents: write

concurrency:
  group: refresh-approved-visual-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'visual-baseline-refresh-2026-07-14'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VISUAL_BASELINE_BASE_URL: http://127.0.0.1:4173
      VISUAL_BASELINE_OUTPUT: .artifacts/visual-baseline
      VISUAL_BASELINE_APPROVED: docs/visual-baseline
      VISUAL_MAX_CHANNEL_DELTA: '16'
      VISUAL_MAX_LOW_DELTA_RATIO: '0.005'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: visual-baseline-refresh-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium and PNG comparator
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Apply current responsive patch and audit overflow
        run: |
          node scripts/patch_tos_detail_responsive_styles.js
          node scripts/audit_visual_overflow_fixes.js

      - name: Start local static server
        run: |
          mkdir -p .artifacts/visual-baseline
          python3 -m http.server 4173 --bind 127.0.0.1 > .artifacts/visual-baseline/server.log 2>&1 &
          echo $! > .artifacts/visual-baseline/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .artifacts/visual-baseline/server.log
          exit 1

      - name: Capture current main-equivalent matrix
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/capture_visual_baseline.js

      - name: Audit capture quality
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'true'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Compare with previous approved baseline
        continue-on-error: true
        run: node scripts/compare_visual_baseline.js

      - name: Validate expected baseline delta
        id: delta
        run: |
          node <<'NODE'
          const fs = require('fs');
          const comparison = JSON.parse(fs.readFileSync('.artifacts/visual-baseline/comparison.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('data/site_health.json', 'utf8'));
          const changed = comparison.changed_cases || [];
          const comparisons = comparison.comparisons || [];
          const missing = comparison.missing_current_cases || [];
          const errors = [];

          if (health?.pages?.public !== 329 || health?.pages?.noindex !== 42) {
            errors.push(`Expected current noindex result 329 public / 42 noindex, found ${health?.pages?.public} / ${health?.pages?.noindex}`);
          }
          if (missing.length) errors.push(`Missing visual cases: ${missing.join(', ')}`);

          let needsUpdate = false;
          if (changed.length === 0) {
            for (const item of comparisons) {
              if (!item.pixel_equivalent) errors.push(`Self-check is not pixel equivalent: ${item.case_id}`);
            }
          } else {
            needsUpdate = true;
            if (changed.length !== 1 || changed[0] !== 'css-reg-010') {
              errors.push(`Only css-reg-010 may change, found: ${changed.join(', ')}`);
            }
            const target = comparisons.find((item) => item.case_id === 'css-reg-010');
            if (!target) errors.push('css-reg-010 comparison is missing');
            else {
              if (target.route !== '/workbench/') errors.push(`Unexpected route for css-reg-010: ${target.route}`);
              if (!target.size_equal) errors.push('css-reg-010 dimensions changed');
              if (target.changed_pixels > 300) errors.push(`css-reg-010 raw changed pixels exceed limit: ${target.changed_pixels}`);
              if (target.significant_changed_pixels > 200) errors.push(`css-reg-010 significant pixels exceed limit: ${target.significant_changed_pixels}`);
            }
            for (const item of comparisons) {
              if (item.case_id !== 'css-reg-010' && !item.pixel_equivalent) {
                errors.push(`Unexpected significant visual change: ${item.case_id}`);
              }
            }
          }

          if (errors.length) throw new Error(errors.join('\n'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_update=${needsUpdate}\n`);
          console.log(needsUpdate
            ? 'Expected workbench counter delta confirmed; baseline refresh is allowed.'
            : 'Current capture is equivalent to the approved baseline.');
          NODE

      - name: Replace approved baseline files
        if: steps.delta.outputs.needs_update == 'true'
        run: |
          cp .artifacts/visual-baseline/css-reg-*.png docs/visual-baseline/
          cp .artifacts/visual-baseline/manifest.json docs/visual-baseline/manifest.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/visual-baseline/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.output_path = 'docs/visual-baseline';
          manifest.approval_reason = 'PR #258 changed only the public page counter on /workbench/: 331 to 329.';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Commit only approved baseline files
        if: steps.delta.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-baseline/manifest.json docs/visual-baseline/css-reg-*.png
          if git diff --cached --quiet; then
            echo 'No approved baseline changes to commit.'
            exit 0
          fi
          git commit -m 'Обновить visual baseline после PR 258'
          git push origin HEAD:visual-baseline-refresh-2026-07-14

      - name: Stop local static server
        if: always()
        run: |
          if [ -f .artifacts/visual-baseline/server.pid ]; then
            kill "$(cat .artifacts/visual-baseline/server.pid)" 2>/dev/null || true
            rm -f .artifacts/visual-baseline/server.pid
          fi

      - name: Upload capture and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-visual-baseline-refresh
          path: .artifacts/visual-baseline
          if-no-files-found: error
          retention-days: 30
