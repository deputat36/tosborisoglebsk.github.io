name: Import VK posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import VK posts
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_DOMAIN: ${{ secrets.VK_DOMAIN }}
        run: node scripts/import_vk_posts.js

      - name: Commit VK posts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Import VK posts'
          file_pattern: 'data/vk_posts.json'
