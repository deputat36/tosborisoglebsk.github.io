name: Capture visual baseline candidates

on:
  workflow_dispatch:
    inputs:
      compare_approved:
        description: Compare captured screenshots with an approved baseline if it exists
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'index.html'
      - 'tos/index.html'
      - 'tos/mirolyubie/index.html'
      - 'contacts/index.html'
      - 'places/**'
      - 'search/index.html'
      - 'news/index.html'
      - 'projects/index.html'
      - 'done/index.html'
      - 'needs/index.html'
      - 'news/vk-community-channel-2026/index.html'
      - 'workbench/index.html'
      - 'site-health/index.html'
      - 'workbench-routes/index.html'
      - 'field-checklist/index.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/img/logo.svg'
      - 'assets/img/logo-dark.svg'
      - 'assets/img/og-cover.svg'
      - 'favicon.svg'
      - 'data/css_regression_matrix.csv'
      - 'docs/VISUAL-BASELINE-CAPTURE.md'
      - 'docs/visual-baseline/**'
      - 'scripts/capture_visual_baseline.js'
      - 'scripts/compare_visual_baseline.js'
      - 'scripts/patch_visual_case_deltas.js'
      - 'scripts/test_visual_case_delta_policy.js'
      - 'scripts/lib/visual_case_delta_policy.js'
      - 'scripts/test_public_browser_interactions.js'
      - 'scripts/test_public_card_navigation.js'
      - 'scripts/patch_keyboard_accessibility.js'
      - 'scripts/test_keyboard_accessibility.js'
      - 'scripts/audit_keyboard_accessibility_tooling.js'
      - 'scripts/patch_tos_contact_fallback.js'
      - 'scripts/audit_tos_contact_fallback.js'
      - 'scripts/test_tos_contact_fallback.js'
      - 'scripts/test_places_tos_navigation.js'
      - 'scripts/test_tos_activity_summary.js'
      - 'scripts/test_public_link_integrity.js'
      - 'scripts/patch_page_index_labels.js'
      - 'scripts/generate_page_index.js'
      - 'scripts/generate_site_health_report.js'
      - 'scripts/enrich_site_health_readiness.js'
      - 'scripts/enrich_site_health_technical_integrity.js'
      - 'scripts/audit_site_health_technical_integrity.js'
      - 'scripts/test_site_health_technical_integrity.js'
      - 'scripts/audit_visual_capture_manifest.js'
      - 'scripts/audit_visual_capture_tooling.js'
      - 'scripts/audit_public_browser_interaction_tooling.js'
      - 'scripts/audit_places_tos_navigation.js'
      - 'scripts/audit_tos_activity_summary.js'
      - 'scripts/audit_visual_overflow_fixes.js'
      - 'scripts/patch_places_tos_links.js'
      - 'scripts/patch_tos_activity_summary.js'
      - 'scripts/generate_places_pages.js'
      - 'scripts/patch_visual_focus_capture.js'
      - 'scripts/patch_visual_baseline_extensions.js'
      - 'scripts/patch_visual_fingerprint_parts.js'
      - 'scripts/patch_tos_detail_responsive_styles.js'
      - 'scripts/lib/csv.js'
      - '.github/workflows/visual-baseline.yml'

permissions:
  contents: read

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VISUAL_BASELINE_BASE_URL: http://127.0.0.1:4173
      VISUAL_BASELINE_OUTPUT: .artifacts/visual-baseline
      VISUAL_BASELINE_APPROVED: docs/visual-baseline
      VISUAL_MAX_CHANNEL_DELTA: '16'
      VISUAL_MAX_LOW_DELTA_RATIO: '0.005'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium and PNG comparator
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Check TOS activity summary tooling syntax
        run: |
          node --check scripts/patch_tos_activity_summary.js
          node --check scripts/audit_tos_activity_summary.js
          node --check scripts/test_tos_activity_summary.js

      - name: Check visual case-delta policy
        run: |
          node --check scripts/lib/visual_case_delta_policy.js
          node --check scripts/test_visual_case_delta_policy.js
          node --check scripts/patch_visual_case_deltas.js
          node scripts/test_visual_case_delta_policy.js

      - name: Apply TOS detail responsive stylesheet
        run: node scripts/patch_tos_detail_responsive_styles.js

      - name: Audit TOS activity summaries
        run: node scripts/audit_tos_activity_summary.js

      - name: Patch place-to-TOS direct links
        run: node scripts/patch_places_tos_links.js

      - name: Apply approved visual case deltas
        run: node scripts/patch_visual_case_deltas.js

      - name: Check patched visual capture syntax
        run: node --check scripts/capture_visual_baseline.js

      - name: Check patched visual comparator syntax
        run: node --check scripts/compare_visual_baseline.js

      - name: Check public browser test syntax
        run: |
          node --check scripts/test_public_browser_interactions.js
          node --check scripts/test_public_card_navigation.js

      - name: Check keyboard accessibility tooling syntax
        run: |
          node --check scripts/patch_keyboard_accessibility.js
          node --check scripts/audit_keyboard_accessibility_tooling.js
          node --check scripts/test_keyboard_accessibility.js

      - name: Apply keyboard accessibility behavior
        run: node scripts/patch_keyboard_accessibility.js

      - name: Check TOS contact fallback tooling syntax
        run: |
          node --check assets/js/contact-relay.js
          node --check scripts/patch_tos_contact_fallback.js
          node --check scripts/audit_tos_contact_fallback.js
          node --check scripts/test_tos_contact_fallback.js

      - name: Apply TOS contact fallback
        run: node scripts/patch_tos_contact_fallback.js

      - name: Audit TOS contact fallback
        run: node scripts/audit_tos_contact_fallback.js

      - name: Check site health technical integrity tooling syntax
        run: |
          node --check assets/js/site-health-integrity.js
          node --check scripts/enrich_site_health_technical_integrity.js
          node --check scripts/audit_site_health_technical_integrity.js
          node --check scripts/test_site_health_technical_integrity.js
          node --check scripts/test_public_link_integrity.js

      - name: Check place-to-TOS navigation syntax
        run: node --check scripts/test_places_tos_navigation.js

      - name: Audit place-to-TOS navigation
        run: node scripts/audit_places_tos_navigation.js

      - name: Audit visual overflow fixes
        run: node scripts/audit_visual_overflow_fixes.js

      - name: Patch visual-run page index labels
        run: node scripts/patch_page_index_labels.js

      - name: Generate visual-run public index
        run: node scripts/generate_page_index.js

      - name: Start local static server
        run: |
          mkdir -p .artifacts/visual-baseline
          python3 -m http.server 4173 --bind 127.0.0.1 > .artifacts/visual-baseline/server.log 2>&1 &
          echo $! > .artifacts/visual-baseline/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .artifacts/visual-baseline/server.log
          exit 1

      - name: Generate visual-run public link integrity report
        env:
          PUBLIC_LINK_BASE_URL: http://127.0.0.1:4173
          PUBLIC_LINK_REPORT: data/public_link_integrity.json
          PUBLIC_LINK_CONCURRENCY: '8'
        run: node scripts/test_public_link_integrity.js

      - name: Generate visual-run site health report
        run: node scripts/generate_site_health_report.js

      - name: Enrich visual-run site health priority readiness
        run: node scripts/enrich_site_health_readiness.js

      - name: Enrich visual-run site health technical integrity
        run: node scripts/enrich_site_health_technical_integrity.js

      - name: Audit visual-run site health technical integrity
        run: node scripts/audit_site_health_technical_integrity.js

      - name: Test public browser interactions
        env:
          PUBLIC_BROWSER_REPORT: .artifacts/visual-baseline/browser-interactions.json
        run: node scripts/test_public_browser_interactions.js

      - name: Test public card navigation
        env:
          PUBLIC_CARD_NAVIGATION_REPORT: .artifacts/visual-baseline/public-card-navigation.json
        run: node scripts/test_public_card_navigation.js

      - name: Test keyboard accessibility
        env:
          KEYBOARD_ACCESSIBILITY_REPORT: .artifacts/visual-baseline/keyboard-accessibility.json
        run: node scripts/test_keyboard_accessibility.js

      - name: Test site health technical integrity
        env:
          SITE_HEALTH_INTEGRITY_REPORT: .artifacts/visual-baseline/site-health-integrity.json
        run: node scripts/test_site_health_technical_integrity.js

      - name: Test TOS contact fallback
        env:
          TOS_CONTACT_FALLBACK_REPORT: .artifacts/visual-baseline/tos-contact-fallback.json
        run: node scripts/test_tos_contact_fallback.js

      - name: Test place-to-TOS navigation
        env:
          PLACES_TOS_REPORT: .artifacts/visual-baseline/places-tos-navigation.json
        run: node scripts/test_places_tos_navigation.js

      - name: Test TOS activity summaries
        env:
          TOS_ACTIVITY_REPORT: .artifacts/visual-baseline/tos-activity-summary.json
        run: node scripts/test_tos_activity_summary.js

      - name: Capture matrix screenshots
        id: capture
        continue-on-error: true
        run: node scripts/capture_visual_baseline.js

      - name: Audit capture manifest in measurement mode
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'false'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Detect approved baseline
        id: approved
        shell: bash
        run: |
          if [ -f docs/visual-baseline/manifest.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require approved baseline for requested comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_approved && steps.approved.outputs.available != 'true' }}
        run: |
          echo 'Approved visual baseline is not present in docs/visual-baseline.'
          exit 1

      - name: Audit capture manifest in strict mode
        if: ${{ steps.approved.outputs.available == 'true' && (github.event_name == 'pull_request' || inputs.compare_approved) }}
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'true'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Compare with approved visual baseline
        if: ${{ steps.approved.outputs.available == 'true' && (github.event_name == 'pull_request' || inputs.compare_approved) }}
        run: node scripts/compare_visual_baseline.js

      - name: Stop local static server
        if: always()
        run: |
          if [ -f .artifacts/visual-baseline/server.pid ]; then
            kill "$(cat .artifacts/visual-baseline/server.pid)" 2>/dev/null || true
            rm -f .artifacts/visual-baseline/server.pid
          fi

      - name: Upload visual capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-${{ github.run_number }}-${{ github.run_attempt }}
          path: .artifacts/visual-baseline
          if-no-files-found: error
          retention-days: 30
