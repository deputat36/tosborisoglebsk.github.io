name: Capture visual baseline candidates

on:
  workflow_dispatch:
    inputs:
      compare_approved:
        description: Compare captured screenshots with an approved baseline if it exists
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'index.html'
      - 'tos/index.html'
      - 'tos/mirolyubie/index.html'
      - 'news/index.html'
      - 'news/vk-community-channel-2026/index.html'
      - 'workbench/index.html'
      - 'site-health/index.html'
      - 'workbench-routes/index.html'
      - 'field-checklist/index.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'data/css_regression_matrix.csv'
      - 'docs/VISUAL-BASELINE-CAPTURE.md'
      - 'docs/visual-baseline/**'
      - 'scripts/capture_visual_baseline.js'
      - 'scripts/compare_visual_baseline.js'
      - 'scripts/audit_visual_capture_manifest.js'
      - 'scripts/audit_visual_capture_tooling.js'
      - 'scripts/audit_visual_overflow_fixes.js'
      - 'scripts/patch_tos_detail_responsive_styles.js'
      - 'scripts/lib/csv.js'
      - '.github/workflows/visual-baseline.yml'

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VISUAL_BASELINE_BASE_URL: http://127.0.0.1:4173
      VISUAL_BASELINE_OUTPUT: .artifacts/visual-baseline
      VISUAL_BASELINE_APPROVED: docs/visual-baseline
      VISUAL_MAX_CHANNEL_DELTA: '16'
      VISUAL_MAX_LOW_DELTA_RATIO: '0.005'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium and PNG comparator
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Apply TOS detail responsive stylesheet
        run: node scripts/patch_tos_detail_responsive_styles.js

      - name: Audit visual overflow fixes
        run: node scripts/audit_visual_overflow_fixes.js

      - name: Start local static server
        run: |
          mkdir -p .artifacts/visual-baseline
          python3 -m http.server 4173 --bind 127.0.0.1 > .artifacts/visual-baseline/server.log 2>&1 &
          echo $! > .artifacts/visual-baseline/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .artifacts/visual-baseline/server.log
          exit 1

      - name: Capture matrix screenshots
        id: capture
        continue-on-error: true
        run: node scripts/capture_visual_baseline.js

      - name: Audit capture manifest in measurement mode
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'false'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Approve reviewed workbench baseline once
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/workbench-manual-blockers' && hashFiles('docs/visual-baseline/APPROVE-WORKBENCH-300') != '' }}
        env:
          APPROVAL_RUN_ID: ${{ github.run_id }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import shutil

          approved_path = pathlib.Path('docs/visual-baseline/manifest.json')
          captured_path = pathlib.Path('.artifacts/visual-baseline/manifest.json')
          approved = json.loads(approved_path.read_text(encoding='utf-8'))
          captured = json.loads(captured_path.read_text(encoding='utf-8'))

          captured_item = next(item for item in captured['results'] if item['case_id'] == 'css-reg-010')
          approved_index = next(index for index, item in enumerate(approved['results']) if item['case_id'] == 'css-reg-010')
          approved['results'][approved_index] = captured_item
          approved['captured_at'] = captured['captured_at']
          approved['commit_sha'] = captured['commit_sha']
          approved['workflow_run_id'] = str(os.environ['APPROVAL_RUN_ID'])
          approved['workflow_run_attempt'] = str(os.environ['APPROVAL_RUN_ATTEMPT'])
          approved['output_path'] = 'docs/visual-baseline'
          approved_path.write_text(json.dumps(approved, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          shutil.copyfile('.artifacts/visual-baseline/css-reg-010.png', 'docs/visual-baseline/css-reg-010.png')

          readme_path = pathlib.Path('docs/visual-baseline/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(
              r'(- `css-reg-010\.png`[^`]+SHA-256 `)[0-9a-f]{64}(`\.)',
              rf'\g<1>{captured_item["sha256"]}\2',
              readme,
          )
          note = (
              '\n## Обновление рабочей панели 16 июля 2026 года\n\n'
              '- pull request: `#300`;\n'
              f'- visual run: `{os.environ["APPROVAL_RUN_ID"]}`;\n'
              '- обновлён только сценарий `css-reg-010`;\n'
              '- остальные 13 утверждённых PNG не изменялись;\n'
              '- технические нарушения, горизонтальное переполнение, console/page errors и failed requests отсутствуют.\n'
          )
          if '## Обновление рабочей панели 16 июля 2026 года' not in readme:
              readme = readme.rstrip() + '\n' + note
          readme_path.write_text(readme, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/visual-baseline/css-reg-010.png docs/visual-baseline/manifest.json docs/visual-baseline/README.md
          git rm docs/visual-baseline/APPROVE-WORKBENCH-300
          git commit -m 'Approve workbench visual baseline for PR 300'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Detect approved baseline
        id: approved
        shell: bash
        run: |
          if [ -f docs/visual-baseline/manifest.json ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require approved baseline for requested comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_approved && steps.approved.outputs.available != 'true' }}
        run: |
          echo 'Approved visual baseline is not present in docs/visual-baseline.'
          exit 1

      - name: Audit capture manifest in strict mode
        if: ${{ steps.approved.outputs.available == 'true' && (github.event_name == 'pull_request' || inputs.compare_approved) }}
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'true'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Compare with approved visual baseline
        if: ${{ steps.approved.outputs.available == 'true' && (github.event_name == 'pull_request' || inputs.compare_approved) }}
        run: node scripts/compare_visual_baseline.js

      - name: Stop local static server
        if: always()
        run: |
          if [ -f .artifacts/visual-baseline/server.pid ]; then
            kill "$(cat .artifacts/visual-baseline/server.pid)" 2>/dev/null || true
            rm -f .artifacts/visual-baseline/server.pid
          fi

      - name: Upload visual capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-${{ github.run_number }}-${{ github.run_attempt }}
          path: .artifacts/visual-baseline
          if-no-files-found: error
          retention-days: 30
