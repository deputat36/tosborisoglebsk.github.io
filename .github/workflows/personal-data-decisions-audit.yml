name: Audit personal data decisions

on:
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - 'data/personal_data_decision_packet.csv'
      - 'data/personal_data_scenario_matrix.csv'
      - 'data/withdrawal_correction_deletion_process.csv'
      - 'data/private_evidence_storage_requirements.csv'
      - 'data/personal_data_readiness.json'
      - 'personal-data-decisions/index.html'
      - 'assets/js/personal-data-decision-validation.js'
      - 'assets/js/personal-data-decisions.js'
      - 'assets/js/personal-data-scenario-validation.js'
      - 'assets/js/personal-data-scenarios.js'
      - 'assets/js/withdrawal-correction-deletion-validation.js'
      - 'assets/js/withdrawal-correction-deletion.js'
      - 'assets/js/private-evidence-storage-validation.js'
      - 'assets/js/private-evidence-storage.js'
      - 'scripts/test_personal_data_decision_packet.js'
      - 'scripts/audit_personal_data_decision_packet.js'
      - 'scripts/audit_personal_data_decision_page.js'
      - 'scripts/test_personal_data_scenario_matrix.js'
      - 'scripts/audit_personal_data_scenario_matrix.js'
      - 'scripts/audit_personal_data_scenario_page.js'
      - 'scripts/test_withdrawal_correction_deletion_process.js'
      - 'scripts/audit_withdrawal_correction_deletion_process.js'
      - 'scripts/audit_withdrawal_correction_deletion_page.js'
      - 'scripts/test_private_evidence_storage_requirements.js'
      - 'scripts/audit_private_evidence_storage_requirements.js'
      - 'scripts/audit_private_evidence_storage_page.js'
      - 'scripts/audit_personal_data_readiness.js'
      - 'scripts/audit_manual_extensions.js'
      - 'docs/PERSONAL-DATA-DECISION-PACKET.md'
      - 'docs/PERSONAL-DATA-SCENARIO-MATRIX.md'
      - 'docs/WITHDRAWAL-CORRECTION-DELETION-PROCESS.md'
      - 'docs/PRIVATE-EVIDENCE-STORAGE-REQUIREMENTS.md'
      - 'docs/PERSONAL-DATA-READINESS-2026-07-14.md'
      - 'package.json'
      - '.github/workflows/personal-data-decisions-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-data-decisions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/personal-data-decision-validation.js
          node --check assets/js/personal-data-decisions.js
          node --check assets/js/personal-data-scenario-validation.js
          node --check assets/js/personal-data-scenarios.js
          node --check assets/js/withdrawal-correction-deletion-validation.js
          node --check assets/js/withdrawal-correction-deletion.js
          node --check assets/js/private-evidence-storage-validation.js
          node --check assets/js/private-evidence-storage.js
          node --check scripts/test_personal_data_decision_packet.js
          node --check scripts/audit_personal_data_decision_packet.js
          node --check scripts/audit_personal_data_decision_page.js
          node --check scripts/test_personal_data_scenario_matrix.js
          node --check scripts/audit_personal_data_scenario_matrix.js
          node --check scripts/audit_personal_data_scenario_page.js
          node --check scripts/test_withdrawal_correction_deletion_process.js
          node --check scripts/audit_withdrawal_correction_deletion_process.js
          node --check scripts/audit_withdrawal_correction_deletion_page.js
          node --check scripts/test_private_evidence_storage_requirements.js
          node --check scripts/audit_private_evidence_storage_requirements.js
          node --check scripts/audit_private_evidence_storage_page.js

      - name: Test personal data decision packet
        run: node scripts/test_personal_data_decision_packet.js

      - name: Audit personal data decision packet
        run: node scripts/audit_personal_data_decision_packet.js

      - name: Test personal data scenario matrix
        run: node scripts/test_personal_data_scenario_matrix.js

      - name: Audit personal data scenario matrix
        run: node scripts/audit_personal_data_scenario_matrix.js

      - name: Audit personal data decision page
        run: node scripts/audit_personal_data_decision_page.js

      - name: Audit personal data scenario page
        run: |
          set -o pipefail
          node scripts/audit_personal_data_scenario_page.js 2>&1 | tee personal-data-scenario-page-audit.log

      - name: Test withdrawal correction deletion process
        run: node scripts/test_withdrawal_correction_deletion_process.js

      - name: Audit withdrawal correction deletion process
        run: node scripts/audit_withdrawal_correction_deletion_process.js

      - name: Audit withdrawal correction deletion page
        run: |
          set -o pipefail
          node scripts/audit_withdrawal_correction_deletion_page.js 2>&1 | tee withdrawal-correction-deletion-page-audit.log

      - name: Test private evidence storage requirements
        run: node scripts/test_private_evidence_storage_requirements.js

      - name: Audit private evidence storage requirements
        run: node scripts/audit_private_evidence_storage_requirements.js

      - name: Audit private evidence storage page
        run: |
          set -o pipefail
          node scripts/audit_private_evidence_storage_page.js 2>&1 | tee private-evidence-storage-page-audit.log

      - name: Audit canonical personal data readiness
        run: node scripts/audit_personal_data_readiness.js

      - name: Run full project mode audits
        run: |
          set -o pipefail
          node scripts/audit_project_mode_full.js 2>&1 | tee personal-data-decisions-project-audit.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-data-decisions-audit
          path: |
            data/personal_data_decision_packet.csv
            data/personal_data_scenario_matrix.csv
            data/withdrawal_correction_deletion_process.csv
            data/private_evidence_storage_requirements.csv
            personal-data-decisions/index.html
            personal-data-scenario-page-audit.log
            withdrawal-correction-deletion-page-audit.log
            private-evidence-storage-page-audit.log
            personal-data-decisions-project-audit.log
          if-no-files-found: warn
          retention-days: 14
