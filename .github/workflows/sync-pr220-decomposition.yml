name: Sync PR 220 decomposition with main

on:
  push:
    branches:
      - pr220-decomposition-2026-07-14
    paths:
      - '.github/workflows/sync-pr220-decomposition.yml'
  pull_request:
    branches:
      - release-2025-12-22
    paths:
      - '.github/workflows/sync-pr220-decomposition.yml'

permissions:
  contents: write

concurrency:
  group: sync-pr220-decomposition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pr220-decomposition-2026-07-14')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: pr220-decomposition-2026-07-14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge current release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release-2025-12-22
          if git merge-base --is-ancestor origin/release-2025-12-22 HEAD; then
            echo "Branch already contains current release branch."
            exit 0
          fi
          git merge --no-edit origin/release-2025-12-22

      - name: Validate merged governance package
        run: |
          node scripts/audit_pr220_decomposition.js
          node scripts/audit_css_source_structure.js
          node scripts/audit_project_mode_full.js

      - name: Push synchronized branch
        run: |
          set -euo pipefail
          if git diff --quiet origin/pr220-decomposition-2026-07-14..HEAD; then
            echo "No synchronization commit to push."
            exit 0
          fi
          git push origin HEAD:pr220-decomposition-2026-07-14
