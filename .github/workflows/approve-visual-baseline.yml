name: Approve visual baseline candidates

on:
  push:
    branches:
      - approve-visual-baseline-main-2026-07-13
    paths:
      - '.github/workflows/approve-visual-baseline.yml'
      - 'scripts/approve_visual_baseline_capture.js'

permissions:
  contents: write

concurrency:
  group: approve-visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.ref == 'refs/heads/approve-visual-baseline-main-2026-07-13'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VISUAL_BASELINE_BASE_URL: http://127.0.0.1:4173
      VISUAL_BASELINE_OUTPUT: .artifacts/visual-baseline
      VISUAL_BASELINE_ARTIFACT: visual-baseline-approval-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout approval branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Chromium and PNG comparator
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Apply generated-page responsive patch
        run: node scripts/patch_tos_detail_responsive_styles.js

      - name: Audit visual overflow fixes
        run: node scripts/audit_visual_overflow_fixes.js

      - name: Start local static server
        run: |
          mkdir -p .artifacts/visual-baseline
          python3 -m http.server 4173 --bind 127.0.0.1 > .artifacts/visual-baseline/server.log 2>&1 &
          echo $! > .artifacts/visual-baseline/server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .artifacts/visual-baseline/server.log
          exit 1

      - name: Capture clean baseline candidates
        run: node scripts/capture_visual_baseline.js

      - name: Require strict clean manifest
        env:
          VISUAL_CAPTURE_STRICT_QUALITY: 'true'
        run: node scripts/audit_visual_capture_manifest.js

      - name: Promote capture to reviewable baseline files
        run: node scripts/approve_visual_baseline_capture.js

      - name: Audit promoted matrix and visual tooling
        run: |
          node scripts/audit_css_regression_matrix.js
          node scripts/audit_visual_capture_tooling.js

      - name: Stop local static server
        if: always()
        run: |
          if [ -f .artifacts/visual-baseline/server.pid ]; then
            kill "$(cat .artifacts/visual-baseline/server.pid)" 2>/dev/null || true
            rm -f .artifacts/visual-baseline/server.pid
          fi

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-approval-${{ github.run_number }}-${{ github.run_attempt }}
          path: .artifacts/visual-baseline
          if-no-files-found: error
          retention-days: 30

      - name: Commit baseline candidates to approval branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Capture reviewable visual baseline candidates'
          file_pattern: 'docs/visual-baseline data/css_regression_matrix.csv'
